# Hand-authored baseline (recorder_sha: "00000000").
# create_tag runs `git tag <tag> <ref>` then `git push origin <tag>`; the
# ref is keyword-only with no default (#11517) so a release tag always
# names the promoted main SHA, never the factory checkout HEAD. Neither
# git command writes to stdout on success (push progress goes to stderr and
# is not modelled). The dispatcher asserts the recorded tag -> ref pairing
# because the bool alone would pass for a fake that ignored `ref`.
