# Build (and on main, publish) the FACTORY image — the orchestrator itself,
# as opposed to Dockerfile.agent, which is the container an agent runs inside.
#
# Multi-arch, built NATIVELY per arch. This is the image an operator actually
# runs on their own machine, so an amd64-only build would mean every Apple
# Silicon developer runs the factory under emulation — the one image where
# native matters most.
#
# Layered on hydraflow-agent-base, which is itself a manifest list, so `FROM`
# resolves the matching arch automatically on each runner.
name: Build Factory Image

on:
  # BOTH protected branches. Watching `main` only means an image change is not
  # built until it has already merged to staging and been promoted — the PR
  # that introduces it never exercises its own smoke test. A gate whose trigger
  # is narrower than its subject cannot see it (#11730).
  push:
    branches: [main, staging]
    paths:
      - 'Dockerfile.factory'
      - 'scripts/docker-factory-smoke-test.sh'
      - '.github/workflows/build-factory-image.yml'
      - 'src/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'Dockerfile.factory'
      - 'scripts/docker-factory-smoke-test.sh'
      - '.github/workflows/build-factory-image.yml'
      - 'src/ui/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_run:
    workflows: ['Build Agent Base Image']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/t-rav/hydraflow-factory
  BASE_IMAGE: ghcr.io/t-rav/hydraflow-agent-base:latest

permissions:
  contents: read

jobs:
  build:
    name: Build & Smoke (${{ matrix.arch }})
    # A base-image run that FAILED must not trigger a build against a stale base.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BOOTSTRAP ONLY. Dockerfile.factory has no self-contained fallback — it
      # takes its venv and user from the base — so an arch the base does not
      # publish yet cannot be built at all. That is a real ordering constraint
      # (base publishes its manifest, then this image can consume it), not a
      # defect, and it self-resolves: the base workflow's completion triggers
      # this one via `workflow_run`.
      #
      # The skip is deliberately NARROW: it fires only when the registry says
      # this exact platform is absent from the base manifest. It cannot become a
      # quiet permanent hole, because the moment the base carries the arch the
      # condition stops matching and the build runs.
      - name: Check the base publishes this architecture
        id: base
        run: |
          if docker manifest inspect "${BASE_IMAGE}" 2>/dev/null \
               | grep -q '"architecture": *"${{ matrix.arch }}"'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${BASE_IMAGE} does not yet publish ${{ matrix.arch }} — skipping this leg until the base image workflow republishes as a manifest list. This is the documented bootstrap order, not a passing build."
          fi

      - name: Build image
        if: steps.base.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.factory
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:test-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=factory-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=factory-${{ matrix.arch }}

      # The build succeeding proves only that the layers assembled. This proves
      # the thing runs — right interpreter, deps importable, app imports,
      # dashboard present, no baked-in target repo — and it proves it NATIVELY,
      # so an arch whose venv is subtly wrong cannot pass on the other's back.
      - name: Smoke test
        if: steps.base.outputs.available == 'true'
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE_NAME }}:test-${{ matrix.arch }} \
            /opt/hydraflow/scripts/docker-factory-smoke-test.sh

  push:
    name: Push Factory (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, no tag — see the base workflow: tagging per-arch has the two
      # runners race to own `:latest` and the loser silently publishes a
      # single-arch image under a multi-arch name.
      - name: Check the base publishes this architecture
        id: base
        run: |
          if docker manifest inspect "${BASE_IMAGE}" 2>/dev/null \
               | grep -q '"architecture": *"${{ matrix.arch }}"'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${BASE_IMAGE} does not yet publish ${{ matrix.arch }} — not pushing this leg. The merge job refuses a partial manifest, so the published image stays as it was rather than silently losing an arch."
          fi

      - name: Build and push by digest
        id: build
        if: steps.base.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.factory
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=factory-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=factory-${{ matrix.arch }}

      - name: Export digest
        if: steps.base.outputs.available == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "::error::build produced no digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.base.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Factory Manifest
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: factory-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          count=$(ls -1 | wc -l)
          echo "digests found: $count"; ls -1
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64, arm64), found $count — refusing to publish a partial manifest"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      # PARSED, not grepped (#11980). This check used
      # `grep '"architecture":"amd64"'` — no space after the colon — while the
      # two base-image checks above it in this same file use the tolerant
      # `'"architecture": *"..."'`. `imagetools inspect --raw` pretty-prints,
      # so the strict pattern matches NOTHING against a complete manifest, and
      # the guard's verdict depended on which buildx version the runner had
      # rather than on what was published. That is how a correct 2-digest
      # publish reported "published manifest has no amd64" once and passed on
      # every other runner.
      #
      # A guard whose answer depends on someone else's output formatting is not
      # a guard, so this reads the platforms out of the JSON. Same refusal,
      # same message, no dependence on spacing.
      - name: Verify both architectures are published
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:latest" --raw \
            | python3 -c '
          import json, sys

          manifest = json.load(sys.stdin)
          published = {
              entry.get("platform", {}).get("architecture")
              for entry in manifest.get("manifests", [])
          }
          for arch in ("amd64", "arm64"):
              if arch not in published:
                  print(f"::error::published manifest has no {arch} "
                        f"(found: {sorted(a for a in published if a)})")
                  raise SystemExit(1)
          print("manifest carries both amd64 and arm64")
          '
