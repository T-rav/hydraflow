# Build (and on main, publish) the FACTORY image — the orchestrator itself,
# as opposed to Dockerfile.agent, which is the container an agent runs inside.
#
# Mirrors build-agent-image.yml: build on every PR that could change the image,
# push only from main. Layered on hydraflow-agent-base, so it rebuilds in
# seconds and inherits dependency changes through the base rather than
# re-resolving them here.
name: Build Factory Image

on:
  push:
    branches: [main, staging]
    paths:
      - 'Dockerfile.factory'
      - 'scripts/docker-factory-smoke-test.sh'
      - 'src/**'
  # BOTH protected branches. The agent workflows watch `main` only, which means
  # an image change is not built until it has already been merged to staging and
  # promoted — the PR that introduces it never exercises its own smoke test. A
  # gate whose trigger is narrower than its subject cannot see it (#11730).
  pull_request:
    branches: [main, staging]
    paths:
      - 'Dockerfile.factory'
      - 'scripts/docker-factory-smoke-test.sh'
      - 'src/ui/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_run:
    workflows: ['Build Agent Base Image']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/t-rav/hydraflow-factory
  BASE_IMAGE: ghcr.io/t-rav/hydraflow-agent-base:latest

jobs:
  build:
    # A base-image run that FAILED must not trigger a build against a stale base.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.factory
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build succeeding proves only that the layers assembled. This proves
      # the thing actually runs: right interpreter, deps importable, app
      # imports, dashboard present, no baked-in target repo.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE_NAME }}:test \
            /opt/hydraflow/scripts/docker-factory-smoke-test.sh

  push:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.factory
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
