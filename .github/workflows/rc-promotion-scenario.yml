name: RC Promotion Scenario

# ADR-0042: the MockWorld + browser + trust scenario suites run on every
# rc/* → main promotion PR. StagingPromotionLoop only auto-merges when
# ``wait_for_ci`` reports green — these are the checks it waits on, bound to
# the PR head SHA by the pull_request event.
#
# pull_request ONLY — no schedule, no workflow_dispatch (#11565). The cron that
# used to live here resolved "the open rc/* PR" through `gh api` and checked
# out `refs/pull/N/merge` from a job output while running with default-branch
# privilege: the exact actions/cache-poisoning/poisonable-step shape CodeQL
# flagged as alert #108 on staging-rc-dryrun.yml — and in a public repo the
# lookup would have matched a fork PR whose head branch was merely *named*
# rc/*. It also never did what its comment claimed ("keeps a stalled PR's CI
# signal fresh"): a scheduled run binds its check runs to the default branch's
# SHA, not the PR head, so wait_for_ci never saw it. The loop's own re-trigger
# is the synthetic-commit push (#8705) that fires pull_request:synchronize; a
# human re-runs the PR's run from the Actions tab.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: rc-scenario-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Resolve RC PR
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve target PR
        id: resolve
        env:
          # Event fields through the environment: a fork's branch name is
          # attacker-chosen text and must never be interpolated into `run:`.
          PR_HEAD_REF_EVENT: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_EVENT: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An RC promotion PR is an rc/* branch cut by StagingPromotionLoop IN
          # THIS REPO. A fork PR named rc/* is not one: the suite is skipped
          # and the required checks stay "expected", so nothing can merge it.
          if [ "$PR_HEAD_REPO_EVENT" != "$THIS_REPO" ]; then
            echo "Fork PR (head repo=$PR_HEAD_REPO_EVENT); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR_HEAD_REF_EVENT" in
            rc/*)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Non-RC PR (head=$PR_HEAD_REF_EVENT); skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  scenario:
    name: Scenario Tests
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TRUST: no `ref:` on purpose. In a pull_request job the default checkout
      # is the event's own merge ref (refs/pull/N/merge — github.ref), not a
      # job output, and the uv cache it writes is scoped to this PR. `gate`
      # admits only same-repo rc/* heads. A push to the PR fires `synchronize`,
      # which cancels this run (concurrency) and starts one on the new merge
      # ref, so there is no stale-SHA race to pin against. Forbidden shape and
      # guard: tests/architecture/test_workflow_checkout_refs.py.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Scenario suite
        run: make scenario JUNIT_DIR=${{ github.workspace }}/junit
      - name: Scenario loops suite
        run: make scenario-loops JUNIT_DIR=${{ github.workspace }}/junit
      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-scenario
          path: junit/*.xml
          retention-days: 14

  scenario-browser:
    name: Browser Scenarios
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # TRUST: no `ref:` — the event's own merge ref; see `scenario` above.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json
      - name: Install Python deps
        run: uv sync --all-extras
      - name: Build UI
        working-directory: src/ui
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium
      - name: Browser scenario suite
        run: make scenario-browser
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: tests/scenarios/browser/_artifacts/
          retention-days: 14

  trust:
    # Adversarial skill corpus (spec §4.1). Runs in fixture mode — no
    # ANTHROPIC_API_KEY required. Live mode (HYDRAFLOW_TRUST_ADVERSARIAL_LIVE=1)
    # is gated on a separate workflow once the secret is provisioned.
    name: Trust Gate (adversarial corpus, fixture mode)
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TRUST: no `ref:` — the event's own merge ref; see `scenario` above.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Trust suite (make trust)
        run: make trust
