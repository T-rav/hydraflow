name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly

permissions:
  contents: read

# Superseded PR runs are cancelled (a new push makes the old run's verdict
# moot); push/schedule runs are never cancelled — rc promotion gates and the
# nightly must always finish (#10027 flake-class fix at the source: without
# groups, every PR push left the prior run burning runners, and "cancelled"
# was ambiguous between superseded and infra-killed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      core_python: ${{ steps.core_filter.outputs.core_python }}
      arch: ${{ steps.filter.outputs.arch }}
      scenario_tests: ${{ steps.filter.outputs.scenario_tests }}
      regression_tests: ${{ steps.filter.outputs.regression_tests }}
      ui: ${{ steps.filter.outputs.ui }}
      ci: ${{ steps.filter.outputs.ci }}
      service_registry: ${{ steps.filter.outputs.service_registry }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      mockworld: ${{ steps.filter.outputs.mockworld }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      compose: ${{ steps.filter.outputs.compose }}
      sandbox_scenarios: ${{ steps.filter.outputs.sandbox_scenarios }}
      config: ${{ steps.filter.outputs.config }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      subprocess_signal: ${{ steps.filter.outputs.subprocess_signal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**/*.py'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # scripts/ is load-bearing for gates, not just tooling:
              # PROMPT_REGISTRY lives in scripts/audit_prompts.py, so without
              # this a PR that deletes AuditTargets skips the very tests that
              # guard the registry (ADR-0116). Deliberately over-inclusive —
              # enumeration failure is merely expensive when a filter decides
              # whether to TEST, and fatal when it decides whether to BLOCK.
              - 'scripts/**'
              # docs/wiki/** belongs here as well as under `arch`. The
              # ubiquitous-language paraphrase lint
              # (tests/test_seed_terms.py) runs against the LIVE wiki, so a PR
              # that only edits docs/wiki/terms/*.md never ran the test that
              # lints it: TermProposerLoop #10919 merged an alias for the bare
              # word "event" with its own PR green, and every subsequent
              # unrelated build went red (#10926). Same rule as scripts/**
              # above — under-inclusive is merely expensive for a TEST filter.
              - 'docs/wiki/**'
              # control/** holds the fleet register + human-signed setpoints
              # (#10824). The PR that SIGNS a setpoint edits only YAML here —
              # and flips a live regulator from inert to acting — so it must
              # run the loader/regulator/parity tests that read these files.
              - 'control/**'
              # agents/** — the console decision ledger and persona contracts
              # (ARCH-0001). tests/test_console_conformance.py guards record
              # shape, chair identity, and numbering against the LIVE tree; a
              # PR that only adds a decision record would otherwise run no
              # Python tests and land an unconformant ledger green. Same rule
              # as docs/wiki/** above.
              - 'agents/**'
              # prompts/**: the auto-agent Markdown templates are model-bound
              # prompts. tests/test_audit_prompts.py renders one of them
              # (preflight_auto_agent) and prompt_observatory reconciles all of
              # them, so editing a template must run those tests. Found by
              # tests/test_ci_path_filter_completeness.py, which exists because
              # this same omission caused two incidents in two days.
              - 'prompts/**'
            arch:
              - 'src/arch/**'
              - 'tests/architecture/**'
              - 'docs/arch/**'
              - 'docs/adr/**'
              - 'docs/wiki/**'
              - 'Makefile'
            scenario_tests:
              - 'tests/scenarios/**'
              - 'tests/sandbox_scenarios/**'
            regression_tests:
              - 'tests/regressions/**'
            ui:
              - 'src/ui/**'
            ci:
              - '.github/workflows/**'
            service_registry:
              - 'src/service_registry.py'
            orchestrator:
              - 'src/orchestrator.py'
            mockworld:
              - 'src/mockworld/**'
            dockerfiles:
              - 'Dockerfile*'
            compose:
              - 'docker-compose*.yml'
            sandbox_scenarios:
              - 'tests/sandbox_scenarios/**'
            config:
              # Startup-behaviour files that can wedge the full-machine sandbox
              # WITHOUT touching mockworld/orchestrator/service_registry — so the
              # sandbox-fast subset would otherwise skip and miss it. #10846: a
              # one-line precondition_gate default flip in config.py rerouted
              # every READY issue to plan forever; prep.py ensures startup labels.
              - 'src/config.py'
              - 'src/prep.py'
            dashboard:
              # The dashboard FRONT-end and the BACK-end the browser scenarios
              # boot (the real dashboard server + repo-runtime registry). #9347
              # broke orchestrator-start via these backend files; the `ui`
              # signal alone would not have tripped. See issue #9359.
              - 'src/ui/**'
              - 'src/dashboard.py'
              - 'src/dashboard_routes/**'
              - 'src/server.py'
              - 'src/repo_runtime.py'
              - 'src/route_types.py'
              - 'tests/scenarios/browser/**'
              - 'tests/scenarios/fakes/mock_world.py'
            subprocess_signal:
              # Signal/reap blast-radius set (#10049, deferred from #10010):
              # the modules where a mocked `.pid` can reach a real os.killpg
              # (#9983/#10002), plus their signal-focused test files. Positive
              # globs ONLY, so this entry is safe in this default-quantifier
              # step — negations belong exclusively in the core_filter step
              # below (predicate-quantifier: every; see #9908). Keep this list
              # in sync with the linux-signal-smoke job's pytest args —
              # tests/regressions/test_issue_10049_linux_signal_lane.py
              # guards both directions.
              - 'src/execution.py'
              - 'src/runner_utils.py'
              - 'src/subprocess_util.py'
              - 'src/process_group.py'
              - 'tests/test_execution.py'
              - 'tests/test_runner_utils.py'
              - 'tests/test_subprocess_util.py'
              - 'tests/regressions/test_reap_processlookuperror.py'
              - 'tests/regressions/test_issue_9553.py'
              - 'tests/regressions/test_issue_9579.py'
              - 'tests/regressions/test_issue_9911_stop_path_reap.py'
              - 'tests/regressions/test_issue_9641_unified_group_kill.py'
              - 'tests/regressions/test_hostrunner_reap_grandchildren.py'
      # core_python lives in its OWN paths-filter step because it is the only
      # filter with `!` negations, and negation semantics depend on the
      # quantifier. Under the default `some`, each `!glob` independently
      # matches every file NOT under glob — so `!src/arch/**` matched any
      # docs file and core_python fired on EVERY PR (Tests/Smoke/Scenario ran
      # on docs-only bot PRs; #9908). Under `every`, a file counts only if it
      # matches ALL patterns: inside the brace-glob include AND outside each
      # negated dir — the subtraction the filter always intended. The include
      # must stay a single brace-glob: with `every`, separate include lines
      # would demand a file match all of them at once (impossible).
      - uses: dorny/paths-filter@v3
        id: core_filter
        with:
          predicate-quantifier: 'every'
          filters: |
            core_python:
              - '{src/**/*.py,tests/**,pyproject.toml,uv.lock,scripts/**,docs/wiki/**,prompts/**,control/**}'
              - '!src/arch/**'
              - '!tests/architecture/**'
              - '!tests/regressions/**'
              - '!tests/scenarios/**'
              - '!tests/sandbox_scenarios/**'
      # Subset invariant: core_python ⊆ python by construction, so
      # core_python=true with python=false can only mean filter semantics
      # regressed (#9908's smoking gun). Fail loudly instead of silently
      # running (or skipping) the wrong jobs.
      - name: Filter subset invariant (core_python implies python)
        if: steps.core_filter.outputs.core_python == 'true' && steps.filter.outputs.python != 'true'
        run: |
          echo "::error::core_python=true while python=false — paths-filter negation semantics regressed (see #9908)"
          exit 1

  # Universal backstop (#9482): reject leftover git conflict markers on EVERY
  # PR/push, ungated by `changes` — a docs-only commit (e.g. a bot wiki write)
  # must not bypass it. #9422 merged raw markers into 11 wiki-term files because
  # no gate inspected a docs-only change. stdlib-only; no uv sync needed.
  conflict-markers:
    name: Conflict Markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for git conflict markers
        run: python3 scripts/check_conflict_markers.py --tracked

  # Universal backstop (#9599): reject git-tracked runtime caches on EVERY
  # PR/push, ungated by `changes`. docs/wiki/{log.jsonl,ingest_dedup.json,
  # index.json} were tracked runtime caches the RepoWikiLoop rewrote every tick,
  # leaving the working tree perpetually dirty (fixed reactively in #9537). This
  # gate catches the next one before it lands. stdlib-only; no uv sync needed.
  runtime-cache-guard:
    name: Runtime Cache Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for runtime caches
        run: python3 scripts/check_runtime_cache_tracked.py --tracked

  lint:
    name: Lint & Format
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format . --check

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Pyright
        run: uv run pyright

  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r . --severity-level medium

  arch:
    name: Architecture Check
    needs: changes
    if: needs.changes.outputs.arch == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate functional_areas.yml
        run: |
          uv run python -c "from arch._functional_areas_schema import load_functional_areas; from pathlib import Path; load_functional_areas(Path('docs/arch/functional_areas.yml')); print('functional_areas.yml: schema OK')"
      - name: Drift check
        run: make arch-check
      - name: Architecture tests
        run: uv run pytest tests/architecture -x --tb=short

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Warning gate (targeted)
        run: PYTHONPATH=src uv run pytest tests/test_execution.py tests/test_agent_advanced.py tests/test_agent_cli.py tests/test_agent_execution.py tests/test_agent_lifecycle.py tests/test_agent_output.py tests/test_hitl_runner.py tests/test_prompt_telemetry.py tests/test_dashboard_routes_control.py tests/test_dashboard_routes_core.py tests/test_dashboard_routes_hitl.py tests/test_dashboard_routes_issue_history.py tests/test_dashboard_routes_metrics.py tests/test_dashboard_routes_repo.py tests/test_dashboard_routes_state.py -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning
      # PR merge gate (Tier 2a): FAST parallel pass/fail, no coverage. Coverage
      # is single-threaded and too slow for the merge path — it moved to the
      # trailing `coverage` job (push-to-staging + nightly). tests/scenarios now
      # runs in the parallel bulk (#10111): its loop-registry leak is contained
      # by the _restore_loop_catalog_registry autouse fixture and OTel state is
      # reset per test, so scenarios are xdist-safe.
      - name: Run tests (fast, parallel — no coverage)
        # xdist-unsafe files excluded here and run serially below:
        #   tests/test_review_phase_metrics.py — leaked review_advisor client
        #     mock (#10119).
        #   tests/test_auto_pr_preflight.py — a mock from another test bleeds
        #     into the shared worker (runner patch not applied → 0 commands, and
        #     a pydantic TypeAdapter AttributeError from a MagicMock-contaminated
        #     type); passes single-threaded (#10500).
        # Keep in sync with the Makefile PYTEST_SERIAL_PATHS.
        run: PYTHONPATH=src uv run pytest tests/ --ignore=tests/regressions --ignore=tests/test_review_phase_metrics.py --ignore=tests/test_auto_pr_preflight.py -n auto --dist loadscope --reruns 2 --reruns-delay 1
      - name: Run serial (xdist-unsafe) tests
        run: PYTHONPATH=src uv run pytest tests/test_review_phase_metrics.py tests/test_auto_pr_preflight.py

  # Trailing coverage gate (Tier 2a). Runs OFF the PR critical path — on push
  # to the default/staging branch and on the nightly schedule only
  # (`if: github.event_name != 'pull_request'`). It STILL fails red if
  # coverage drops below 70%, so the gate is preserved as a trailing safety
  # net rather than dropped. The `changes` gating mirrors the `test` job.
  # Deliberately NOT in ci-gate's `needs`: it must not gate the PR merge path.
  #
  # #10883: single-threaded (`-p no:xdist`) 23,011 tests routinely blew the
  # 30-min timeout and got CANCELLED with zero FAILED lines — pytest progress
  # advanced steadily to 81% at the instant of cancellation (no stall), so
  # this was capacity exhaustion, not a hang; GateHealthLoop misread it as a
  # suspected hang and filed a killpg playbook issue per push. Fixed by
  # mirroring the `test` job's parallel + serial split, verified locally:
  # pytest-cov 7.0.0 + xdist combines worker coverage data correctly. Leg 1
  # (parallel) passes --cov-fail-under=0 --cov-report= — partial worker data
  # must never trip the floor. Leg 2 (serial, terminal) carries --cov-append
  # plus the real --cov-fail-under=70 and the reports, so it sees every
  # worker's appended data. --timeout=300 (>=3x the slowest observed local
  # test, 37.35s) turns a genuine hang into a named FAILED test instead of a
  # silent cancellation.
  coverage:
    name: Coverage (trailing)
    needs: changes
    if: |
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests with coverage (fast, parallel)
        # Ignore list matches the `test` job's parallel leg exactly (guarded
        # by tests/regressions/test_issue_10883.py) — keep in sync with the
        # Makefile PYTEST_SERIAL_PATHS.
        run: PYTHONPATH=src uv run pytest tests/ --ignore=tests/regressions --ignore=tests/test_review_phase_metrics.py --ignore=tests/test_auto_pr_preflight.py --cov=src --cov-append --cov-fail-under=0 --cov-report= -n auto --dist loadscope --reruns 2 --reruns-delay 1 --timeout=300 --durations=25
      - name: Run serial (xdist-unsafe) tests + regressions with coverage
        # tests/regressions is excluded from leg 1's ignore list (parity
        # with the `test` job) so it has to be collected here — the single-
        # threaded original run implicitly covered it via bare `pytest tests/`.
        # #11103: running the WHOLE regressions dir serially is a deliberate
        # SUPERSET of the Makefile's fine-grained PYTEST_SERIAL_PATHS split —
        # coarser is safe (merely slower) and this lane is off the PR critical
        # path. The superset relation is pinned by tests/regressions/
        # test_issue_10883.py::test_coverage_serial_leg_covers_every_makefile_serial_path.
        run: PYTHONPATH=src uv run pytest tests/test_review_phase_metrics.py tests/test_auto_pr_preflight.py tests/regressions --cov=src --cov-append --cov-fail-under=70 --cov-report=term-missing --cov-report=json --timeout=300 --durations=25
      - name: Upload coverage.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  smoke:
    name: Smoke Tests
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci
      - name: Run smoke tests
        run: make smoke

  scenario:
    name: Scenario Tests
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.scenario_tests == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run scenario tests
        run: make scenario
      - name: Run scenario loop tests
        run: make scenario-loops

  regression:
    name: Regression Tests
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.regression_tests == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run regression tests (parallel; reap tests serial)
        # The subprocess-group reap tests race under parallel workers, so they
        # run SERIALLY here (they also have the signal-context lane below); the
        # rest of tests/regressions/ is xdist-safe and parallelizes. Keep the
        # reap-file list in sync with the Makefile REAP_TESTS.
        # test_auto_pr_preflight_gate.py joins the serial list for a different
        # reason: it is the same xdist-unsafe class as test_auto_pr_preflight.py
        # (patches subprocess_util.run_subprocess + auto_pr's runner prefix), so
        # a bled mock leaves the patch unapplied and it asserts on the wrong
        # preflight stage. Passes single-threaded.
        run: |
          set -euo pipefail
          REAP="tests/regressions/test_reap_processlookuperror.py \
            tests/regressions/test_issue_9553.py \
            tests/regressions/test_issue_9579.py \
            tests/regressions/test_issue_9911_stop_path_reap.py \
            tests/regressions/test_issue_9641_unified_group_kill.py \
            tests/regressions/test_hostrunner_reap_grandchildren.py \
            tests/regressions/test_auto_pr_preflight_gate.py"
          IGNORES=""; for f in $REAP; do IGNORES="$IGNORES --ignore=$f"; done
          # --forked isolates every test in its own subprocess so a test that
          # leaks worker state (a global holding another test's tmp path) cannot
          # poison a later test on the same xdist worker (#11004). --reruns can't
          # fix this class — a rerun stays on the poisoned worker; only a fresh
          # process does. The REAP lane below stays un-forked (its subprocess-
          # group reap assertions are their own isolation regime).
          PYTHONPATH=src uv run pytest tests/regressions/ $IGNORES -n auto --dist loadscope --forked --reruns 2 --reruns-delay 1 -q
          PYTHONPATH=src uv run pytest $REAP -q

  # Linux signal-context smoke lane (#10049, deferred from #10010). Reruns the
  # reap/signal-focused test subset INSIDE a plain Linux container as root —
  # not merely `runs-on: ubuntu-latest`, which the `test` job already is. The
  # container-as-root process tree is the environment where a mocked `.pid`
  # reaching the real `os.killpg` hit the container's own PID 1 and wedged the
  # job until timeout-cancel (#9983/#10002): benign EPERM on a macOS dev box,
  # fatal on Linux CI — that platform divergence IS the signal this lane
  # surfaces at PR time instead of at the 30-minute Tests timeout. ADVISORY by
  # design: no gates.toml record and deliberately NOT in ci-gate's `needs` —
  # per #9922, an advisory lane must never block RC auto-merge. Keep the
  # pytest file list in sync with the subprocess_signal filter above
  # (tests/regressions/test_issue_10049_linux_signal_lane.py guards both
  # directions).
  linux-signal-smoke:
    name: Linux Signal Smoke (advisory)
    needs: changes
    if: needs.changes.outputs.subprocess_signal == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run signal/reap test subset in a Linux container as root
        run: |
          # --init matters: without it bash is PID 1 and killed grandchildren
          # zombify unreaped, so the real-process reap tests read them as
          # still alive and fail spuriously (validated locally). The GitHub
          # runner VM has a real init, so tini-as-PID-1 is the faithful
          # container analogue; root + Linux killpg delivery — the #9983
          # divergence — is unchanged.
          docker run --rm --init -v "$PWD":/w -w /w \
            -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=src \
            python:3.11-slim bash -c '
              pip install --quiet uv &&
              uv sync --all-extras --quiet &&
              uv run pytest \
                tests/test_execution.py \
                tests/test_runner_utils.py \
                tests/test_subprocess_util.py \
                tests/regressions/test_reap_processlookuperror.py \
                tests/regressions/test_issue_9553.py \
                tests/regressions/test_issue_9579.py \
                tests/regressions/test_issue_9911_stop_path_reap.py \
                tests/regressions/test_issue_9641_unified_group_kill.py \
                tests/regressions/test_hostrunner_reap_grandchildren.py \
                -q -p no:cacheprovider'

  # Time-travel guard (#11047): re-run the bomb-prone test subset with the
  # wall clock offset +90 days (freezegun via the HYDRAFLOW_TIME_TRAVEL_DAYS
  # conftest fixture), so fixture time-bombs — absolute dates or frozen
  # anchors that age past a now()-relative threshold — detonate at PR time
  # instead of on a future RC (two RC-blocking detonations in 48h: PRs
  # #11045, #11053). ADVISORY by design: no gates.toml record and
  # deliberately NOT in ci-gate's `needs` — per #9922, an advisory lane must
  # never block RC auto-merge. Keep the pytest file list in sync with the
  # `time-travel` Makefile target.
  time-travel:
    name: Time Travel (advisory)
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Run bomb-prone subset at +90 days
        run: |
          uv sync --extra test --quiet
          PYTHONPATH=src HYDRAFLOW_TIME_TRAVEL_DAYS=90 uv run pytest \
            tests/regressions/ \
            tests/test_time_travel_guard.py \
            tests/test_diagnostics_judge_calibration_route.py \
            tests/test_escape_ledger_loop.py \
            tests/test_boot_gap_detector.py \
            tests/test_diagnostics_cost_rollup_routes.py \
            tests/test_staleness.py \
            tests/test_diagnostics_finder_faceplates_route.py \
            -p no:randomly -q -p no:cacheprovider

  # Gauge gauntlet (#11060 slice 2): execute the scaffold rails FOR REAL —
  # fixture repo per gauge, lay the real scaffolds, run the quality commands a
  # stamped child would run. Kills the dead-strings failure mode the Phase-0
  # audit found (8 of 9 gauges had never executed). python + javascript run;
  # the rest report UNEXERCISED by name (no silent caps). ADVISORY by design:
  # no gates.toml record and deliberately NOT in ci-gate's `needs` — per
  # #9922, an advisory lane must never block RC auto-merge. Keep the gauge
  # list in sync with the `gauge-gauntlet` Makefile target's default docs.
  gauge-gauntlet:
    name: Gauge Gauntlet (advisory)
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Execute python + javascript gauges
        run: |
          uv sync --extra test --quiet
          PYTHONPATH=src uv run python -m scripts.gauge_gauntlet \
            --gauges python,javascript

  audit:
    name: Principles Audit
    needs: changes
    if: needs.changes.outputs.core_python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # P5.6 (`git log origin/main`) and P10.3 (fix-commit history since
          # the baseline) read real git history. The default depth-1 checkout
          # made both `git log` calls fail, silently degrading two principles
          # to NA in CI. Full history keeps them honest; the clone stays well
          # inside this job's 5-minute timeout.
          fetch-depth: 0
      - name: Resolve origin HEAD
        # actions/checkout leaves refs/remotes/origin/HEAD unset on PR
        # checkouts (which are a merge commit, not a fetched branch).
        # P5.5 (branch-protection probe) needs origin/HEAD to detect the
        # default branch, so fetch main explicitly and point HEAD at it.
        # No --depth here: P5.6 walks the last 100 commits of origin/main.
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
          # P10.6 diffs the PR against its base; make the base ref resolvable.
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          fi
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run principles audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # P10.6 per-PR regression gate: empty on push builds, so the gate
          # is NA there and only the telemetry history scan runs (#9902).
          HYDRAFLOW_AUDIT_PR_BASE: ${{ github.base_ref }}
        run: make audit
      - name: Console conformance (ledger immutability)
        # #11110 (sampled-audit upheld): ARCH-0001 declares ledger
        # immutability `Enforced by: make console-conformance`, but nothing
        # in CI ever ran it — the git-history check (#6) needs a full clone,
        # which THIS job uniquely already has (fetch-depth: 0 above). The
        # unit test (tests/test_console_conformance.py) covers the
        # shape/numbering/staleness checks with check_git=False; this step
        # closes the immutability half so a merged decision record cannot be
        # silently rewritten green.
        run: make console-conformance

  ui-build:
    name: Dashboard Build
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json
      - name: Install dependencies
        working-directory: src/ui
        run: npm ci
      - name: Build
        working-directory: src/ui
        run: npm run build
      - name: Test
        working-directory: src/ui
        run: npm test

  sandbox-fast:
    name: Sandbox (PR→staging fast subset)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.base_ref == 'staging' && (
        needs.changes.outputs.service_registry == 'true' ||
        needs.changes.outputs.orchestrator == 'true' ||
        needs.changes.outputs.mockworld == 'true' ||
        needs.changes.outputs.dockerfiles == 'true' ||
        needs.changes.outputs.compose == 'true' ||
        needs.changes.outputs.sandbox_scenarios == 'true' ||
        needs.changes.outputs.config == 'true'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      - run: docker compose -f docker-compose.sandbox.yml build hydraflow ui playwright
      - name: Run fast subset (s01, s06, s53, s54, s55, s58, s59)
        run: |
          # Run every scenario and aggregate failures — do NOT early-exit on the
          # first red, or a broken leading scenario (e.g. s01, #9754) silently
          # hides the status of the ones after it. Report which failed.
          # Keep this list in sync with the scenario-file QUARANTINED markers
          # until the loader drives this step's selection too. s55 was
          # quarantined under #9925 and un-quarantined once the #9796
          # discover/shape wedge fix (#9919) proved to resolve it. s58 gates the
          # work-queue strategy dial (#10037): the picker decides what the
          # factory works on next, and the dial is the only runtime access to
          # it, so a broken dropdown is worth catching per-PR rather than at
          # the next collective run. s59 guards the board's strategy badge —
          # the config→/api/control/status→context→StreamView chain that tells
          # an operator which algorithm is picking work (#10067).
          rc=0
          for s in s01_happy_single_issue s06_kill_switch_via_ui s53_model_routing_settings_ui s54_decompose_to_converge s55_nested_decompose s58_work_queue_settings_ui s59_queue_strategy_board_badge; do
            if python scripts/sandbox_scenario.py run "$s"; then
              echo "::notice::sandbox $s PASSED"
            else
              echo "::error::sandbox $s FAILED"
              rc=1
            fi
          done
          exit $rc
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-fast-results
          path: /tmp/sandbox-results/
          retention-days: 7

  # PR-time early warning for dashboard regressions. The full Browser Scenarios
  # suite only runs at rc/*->main promotion (rc-promotion-scenario.yml), which
  # meant the #9347 dashboard regression rode into staging unvalidated for ~4
  # days while the (separately-broken) promotion loop wasn't cutting RCs. This
  # runs a fast smoke+happy+controls subset on PR->staging whenever dashboard
  # front- or back-end code changes — catching orchestrator-start / pipeline
  # regressions at PR time. The full suite stays the final gate at promotion.
  # See issue #9359.
  scenario-browser-fast:
    name: Browser Scenarios (PR→staging fast subset)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.base_ref == 'staging' && needs.changes.outputs.dashboard == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json
      - name: Install Python deps
        run: uv sync --all-extras
      - name: Build UI
        working-directory: src/ui
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium
      - name: Browser smoke + happy + orchestrator-controls subset
        run: |
          PYTHONPATH=src uv run pytest \
            tests/scenarios/browser/test_smoke.py \
            tests/scenarios/browser/scenarios/test_happy_browser.py \
            tests/scenarios/browser/workflows/test_orchestrator_controls.py \
            -m scenario_browser --reruns=1 -v
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-browser-fast-trace
          path: tests/scenarios/browser/_artifacts/
          retention-days: 7

  # The 71-scenario RC sandbox suite fanned across parallel matrix shards
  # (round-robin, ~12 scenarios each) so the RC gate runs in ~one shard's
  # wall-clock instead of the whole suite's. Each runner boots its own
  # docker sandbox, so shards are fully isolated (no shared ports/state).
  sandbox-shard:
    name: Sandbox shard
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.base_ref == 'main' && startsWith(github.head_ref, 'rc/')
    strategy:
      fail-fast: false # run every shard so all failures surface in one pass
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      - run: docker compose -f docker-compose.sandbox.yml build hydraflow ui playwright
      - name: Run shard ${{ matrix.shard }}/6
        run: python scripts/sandbox_scenario.py run-all --shard ${{ matrix.shard }}/6
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-full-results-shard-${{ matrix.shard }}
          path: /tmp/sandbox-results/
          retention-days: 7

  # Aggregator gate — KEEPS the exact required-check name so main's ruleset is
  # unchanged. Passes only when every shard succeeded; fails (and auto-labels
  # once) if any shard failed. `always()` so it still runs when a shard fails;
  # the rc-condition keeps it skipped (neutral) on non-RC PRs, as before.
  sandbox-full:
    name: Sandbox (rc/* promotion PR full suite)
    runs-on: ubuntu-latest
    needs: [sandbox-shard]
    if: always() && github.base_ref == 'main' && startsWith(github.head_ref, 'rc/')
    steps:
      - name: Gate on all sandbox shards
        run: |
          result="${{ needs.sandbox-shard.result }}"
          echo "sandbox-shard matrix result: $result"
          [ "$result" = "success" ] || { echo "One or more sandbox shards failed."; exit 1; }
      - name: Auto-label PR for self-fix on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label sandbox-fail-auto-fix
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Sandbox suite failed. SandboxFailureFixerLoop will dispatch the auto-agent. Per-shard logs: \`sandbox-full-results-shard-*\` artifacts."

  sandbox-nightly:
    name: Sandbox (nightly regression)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    # Workflow-level default is contents:read; the failure step files a
    # hydraflow-find issue, which needs issues:write (#10309 follow-up — the
    # nightly's issue-create had silently lacked the scope).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      - run: docker compose -f docker-compose.sandbox.yml build hydraflow ui playwright
      - name: Run full suite + record metrics
        run: python scripts/sandbox_scenario.py run-all
      - name: Open hydraflow-find issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Sandbox nightly failure $(date -I)" \
            --label hydraflow-find,sandbox-nightly \
            --body "Nightly sandbox run failed. Logs attached as artifact."
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-nightly-results
          path: /tmp/sandbox-results/
          retention-days: 14

  # Post-merge full-machine smoke (#10309). Every sandbox job above is
  # PR-gated or scheduled, so a merge that broke the factory's core loop
  # (issue → build → PR → merge) or the ADR-0042 RC promotion path stayed
  # invisible until the next PR's gate or the 03:00 UTC nightly. This boots
  # the real server once (MockWorld at the ports) and drives BOTH merge lanes
  # via s82 on every push to staging/main — a machine-breaking merge is
  # caught within minutes of landing. Advisory-but-alerting: not in ci-gate
  # (push context has no PR to gate); failures roll up into ONE open
  # post-merge-smoke issue the factory's issue loop picks up.
  post-merge-smoke:
    name: Post-merge smoke (full machine, s82)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 20
    # The failure step provisions a label + files/updates a rolling
    # hydraflow-find issue; the workflow-level contents:read default can do
    # neither, so grant issues:write here (#10309 follow-up).
    permissions:
      contents: read
      issues: write
    concurrency:
      # Merge trains (e.g. the staging batch-merge cascade) push in quick
      # succession; only the newest SHA's verdict matters.
      group: post-merge-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - run: docker compose -f docker-compose.sandbox.yml build hydraflow ui playwright
      - name: Run s82 (standard PR path + RC promotion path, one boot)
        run: make post-merge-smoke
      - name: File or update rolling post-merge-smoke issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rolling-issue pattern (#9359 issue-hygiene): one open issue tracks
          # "post-merge smoke is red"; per-push failures append as comments
          # instead of piling up new issues. Label is provisioned first — a
          # raw `gh issue create` with a missing label hard-fails (#10297).
          gh label create post-merge-smoke \
            --description "Post-merge full-machine smoke (s82) failed" \
            --color D93F0B || true
          body="Post-merge smoke failed on \`${{ github.ref_name }}\` at ${{ github.sha }}. The full machine (issue → merged PR, and rc/* cut → promoted) no longer completes after this merge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label post-merge-smoke --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Post-merge smoke failing on ${{ github.ref_name }}" \
              --label hydraflow-find,post-merge-smoke \
              --body "$body"
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-smoke-results
          path: /tmp/sandbox-results/
          retention-days: 7

  # Umbrella aggregator (ADR-0082 / add-a-gate runbook). One check that rolls up
  # every conditional CI job. `if: always()` + `needs:` means a path-filtered
  # SKIPPED job is treated as "passed", so requiring ONLY this single context in
  # branch protection gives strict gating without the path-filter footgun (a
  # skipped required check otherwise reads as "not passed" and blocks forever).
  # Not yet a required check: it must land on the base branch before being
  # required (see docs/standards/branch_protection/ADDING-A-GATE.md).
  # linux-signal-smoke is EXCLUDED on purpose: it is an advisory lane (#10049)
  # and must never gate RC auto-merge (#9922) — do not add it to `needs`.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, security, arch, test, smoke, scenario, regression, audit, ui-build, scenario-browser-fast]
    if: always()
    steps:
      - name: Require all CI jobs to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped (path-filtered)."
