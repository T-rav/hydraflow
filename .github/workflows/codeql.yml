name: "CodeQL"

on:
  # Run on BOTH main and staging. Under the two-tier model (ADR-0042) all work
  # PRs target staging, never main — so triggering only on `[main]` meant
  # CodeQL never scanned normal work and issues surfaced for the first time at
  # the staging->main RC-promotion PR (e.g. alert #106). Adding staging catches
  # them at the PR that introduces them, not weeks later at the RC cut.
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "30 3 * * 1"
  # On-demand runs for validating a security fix (e.g. a sanitizer model-pack,
  # #9143) against an arbitrary branch without waiting for the scheduled scan.
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    env:
      # Disable overlay mode — cached base database references the old repo
      # name (hyrda) which breaks the pre-finalize working directory.
      CODEQL_ACTION_DISABLE_OVERLAY: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete old CodeQL databases
        run: rm -rf /home/runner/work/_temp/codeql_databases

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Excludes adversarial/holdout test FIXTURES (synthetic apps that
          # deliberately plant issues) from analysis — see the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Also write the SARIF locally so the dismiss-alerts step below can
          # read its suppressions[] (populated by CodeQL's built-in
          # AlertSuppression query from inline `# codeql[<rule>]` comments).
          output: sarif-results

      # GitHub code scanning does NOT natively honor inline suppression
      # comments — CodeQL records them in the SARIF suppressions[] array, but
      # the alert stays open until applied via the Code Scanning API. This step
      # applies them, so the scoped `# codeql[py/clear-text-storage-sensitive-data]`
      # suppression on file_util.append_jsonl (an ADR-0085 scrub_secrets false
      # positive, issue #9143) actually dismisses the alert. Runs only on the
      # python leg (the only language with a suppression) and only on the
      # default branch (dismissing requires the alert to exist there, and PR
      # runs must never dismiss).
      - name: Apply inline suppressions to code scanning
        if: matrix.language == 'python' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: advanced-security/dismiss-alerts@v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/python.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
