name: Sandbox Scenario (dispatch)

# Remote sandbox verification, on demand (#11601).
#
# The factory host is a single Mac driving 20+ merged PRs/day. Booting a
# docker compose stack on it to verify a scenario steals the exact resource
# the factory needs, and does it during production hours. This workflow moves
# that run onto a GitHub runner: a builder or operator dispatches it against a
# ref, gets the PASS/FAIL verdict in the job summary, and never touches the
# host's docker daemon.
#
# Local `docker compose` runs remain the right tool for *developing* a
# scenario (fast edit/run loop, `sandbox_scenario.py shell`). They are not the
# right tool for *verifying* one. See docs/wiki/testing.md, entry
# "Sandbox verification runs belong in CI, not on the factory host".
#
# This is a MANUAL lane, never a required check — it must not attach to a PR
# or gate a merge. The required sandbox lanes stay exactly where they are in
# ci.yml; deliberately not refactored into a shared reusable workflow, because
# a `workflow_call` conversion of `sandbox-fast` / `sandbox-shard` renames the
# check contexts branch protection requires (see
# docs/standards/branch_protection/ADDING-A-GATE.md). The two share what is
# actually worth sharing — the cached image build
# (.github/actions/build-agent-image) — and the fast-subset scenario list is
# held identical by tests/architecture/test_sandbox_ci_cache.py rather than by
# a risky refactor of a required lane.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch being verified. MUST equal the ref this run was dispatched on (`--ref`); it is an asserted intent, not the thing checked out. Defaults to the default branch."
        required: false
        default: staging
        type: string
      scenario:
        description: "Scenario name (e.g. s01_happy_single_issue), `fast` for the PR→staging fast subset, or `all` for the whole suite."
        required: false
        default: fast
        type: string

permissions:
  contents: read

concurrency:
  # One dispatch per (branch, scenario) at a time; a second press queues
  # rather than racing the first for the same runner-side docker state.
  #
  # The branch comes from `github.ref_name` (what actually gets checked out),
  # not `inputs.ref`. For the scenario, `inputs.*` and NOT
  # `github.event.inputs.*`: the latter carries only what the caller
  # explicitly sent, so a CLI/API dispatch that omits the field yields ''
  # instead of the declared default and two runs that ARE the same
  # (branch, scenario) land in different groups. The `inputs` context
  # resolves defaults and is available to workflow-level `concurrency`.
  group: sandbox-dispatch-${{ github.ref_name }}-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  sandbox:
    name: Sandbox scenario run
    runs-on: ubuntu-latest
    # `all` runs the full ~78-scenario suite unsharded; the fast subset is
    # ~15 min with a warm cache. Generous, but bounded.
    timeout-minutes: 180
    # packages:read pulls the buildx layer cache. Read-only, deliberately:
    # this lane runs against any branch an operator selects, so it must never
    # be able to write the GHCR cache the required lanes read. The post-merge
    # push lane is the only writer.
    permissions:
      contents: read
      packages: read
    steps:
      # Runs BEFORE the checkout: nothing untrusted should reach the runner's
      # disk, let alone a later step that executes it (`pip install -e .`
      # alone runs repo-authored build hooks). Needs no repository.
      - name: Validate dispatch inputs
        env:
          REF: ${{ inputs.ref }}
          RUN_REF: ${{ github.ref_name }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          # Scenario names are python module names; reject anything else
          # before it reaches the harness.
          if ! printf '%s' "$SCENARIO" | grep -Eq '^[a-z0-9_]+$'; then
            echo "::error::invalid scenario input: must match ^[a-z0-9_]+$"
            exit 1
          fi
          # THE INTERLOCK. `ref` is an assertion of intent, never the thing
          # checked out — see the checkout's comment below for why. The run's
          # own ref is what gets verified, so the two must agree or the job
          # would silently verify something other than what was asked for.
          if [ "$REF" != "$RUN_REF" ]; then
            echo "::error::ref mismatch: asked for '$REF' but this run is on '$RUN_REF'. Dispatch selects the ref, so pass both: gh workflow run \"Sandbox Scenario (dispatch)\" --ref $REF -f ref=$REF -f scenario=$SCENARIO"
            exit 1
          fi

      # No `ref:` on purpose — this is the fix for CodeQL
      # actions/cache-poisoning/poisonable-step (high), which fired here on
      # #11621 with the same rule as alert #108/#11518.
      #
      # `ref: ${{ inputs.ref }}` is a privileged checkout of input-designated
      # code: a workflow_dispatch run can WRITE the cache scope of the branch
      # it runs on, so a run sitting on the default branch while executing
      # some other ref's code lets that code poison the default-branch cache
      # every other workflow restores from. Pinning `cache-binary: false`
      # does not fix it — any step executing the tree holds the runtime cache
      # token regardless of which actions we call.
      #
      # Checking out the RUN'S OWN ref removes the mismatch entirely: the
      # code executed and the cache scope written are the same branch, which
      # is exactly the isolation the rule asks for. Selecting the ref moves
      # from an input to `--ref` (the branch selector) — where dispatch was
      # always going to put it — and the `ref` input above stays as the
      # asserted intent, mirroring the pin-and-assert shape `staging-rc-
      # dryrun.yml` already uses for this same alert class.
      - uses: actions/checkout@v4

      - name: Record what is being verified
        id: target
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Verifying ref=${GITHUB_REF_NAME} scenario=${SCENARIO} at $(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install uv && uv pip install --system -e ".[dev]"

      - name: Build agent image (GHCR layer cache)
        uses: ./.github/actions/build-agent-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # `hydraflow` is absent on purpose — the step above built and loaded it.
      - run: docker compose -f docker-compose.sandbox.yml build fake-llm-http gateway ui playwright

      - name: Run scenario(s)
        id: run
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -uo pipefail
          LOG=/tmp/sandbox-dispatch.log
          VERDICT=/tmp/sandbox-dispatch-verdict.txt
          : > "$LOG"
          : > "$VERDICT"
          rc=0

          run_one() {
            local name="$1"
            echo "::group::sandbox $name"
            if python scripts/sandbox_scenario.py run "$name" 2>&1 | tee -a "$LOG"; then
              echo "PASSED  $name" >> "$VERDICT"
              echo "::notice::sandbox $name PASSED"
            else
              echo "FAILED  $name" >> "$VERDICT"
              echo "::error::sandbox $name FAILED"
              rc=1
            fi
            echo "::endgroup::"
          }

          case "$SCENARIO" in
            all)
              # run-all prints its own summary table; capture it wholesale.
              if python scripts/sandbox_scenario.py run-all 2>&1 | tee -a "$LOG"; then
                echo "PASSED  full suite" >> "$VERDICT"
              else
                echo "FAILED  full suite" >> "$VERDICT"
                rc=1
              fi
              ;;
            fast)
              # Keep this list byte-identical to the `sandbox-fast` job in
              # ci.yml — tests/architecture/test_sandbox_ci_cache.py fails if
              # the two (or the README) drift apart. Aggregate failures; never
              # early-exit, or a broken leading scenario hides the rest.
              for s in s01_happy_single_issue s06_kill_switch_via_ui s53_model_routing_settings_ui s54_decompose_to_converge s55_nested_decompose s58_work_queue_settings_ui s59_queue_strategy_board_badge s91_gateway_session_tap; do
                run_one "$s"
              done
              ;;
            *)
              run_one "$SCENARIO"
              ;;
          esac
          exit $rc

      # always(): the verdict is the whole point of a dispatch, and a red run
      # is exactly when the operator needs the tail without opening the log.
      - name: Write PASS/FAIL tail to the job summary
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
          SHA: ${{ steps.target.outputs.sha }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -uo pipefail
          {
            echo "## Sandbox dispatch — ${OUTCOME:-not run}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`${GITHUB_REF_NAME}\` |"
            echo "| commit | \`${SHA:-unresolved}\` |"
            echo "| scenario | \`${SCENARIO}\` |"
            echo
            echo "### Verdict"
            echo
            echo '```'
            cat /tmp/sandbox-dispatch-verdict.txt 2>/dev/null || echo "(no scenarios ran)"
            echo '```'
            echo
            echo "### Log tail"
            echo
            echo '```'
            tail -n 80 /tmp/sandbox-dispatch.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-dispatch-results
          path: |
            /tmp/sandbox-results/
            /tmp/sandbox-dispatch.log
            /tmp/sandbox-dispatch-verdict.txt
          if-no-files-found: warn
          retention-days: 7
