# Factory Autonomy — the SHIPPED DEFAULT act-vs-ask policy (CH-3, #9731).
#
# This is no longer a governing declaration. Since #12116 the policy a repo is
# governed by lives in its own `charter.yaml` under `policy:`, and
# `config.merge_policy_path` reads it from there. This file is the seed the
# onboarding stamp copies into a new repo's charter, and the last-resort
# fallback for a repo that declares none.
#
# It moved out of `docs/standards/factory_autonomy/` for two reasons. One is
# that two normative-looking files describing one thing is the duplication
# #12116 removed. The other is that `docs/` is documentation, not package data:
# `checkout_path` exists for "development-only inputs deliberately absent from
# the wheel", so the old fallback silently had nothing to fall back to in a
# wheel install. As package data beside `model_pricing.json` it ships.
#
# The prose table in `docs/standards/factory_autonomy/README.md` is commentary
# bound to THIS repo's governing copy — `charter.yaml`'s `policy:` section — by
# drift CI (tests/architecture/test_factory_autonomy_policy_drift.py): every
# README table row must have exactly one entry there (matched on `readme_row`,
# with the row's Action column direction matching `autonomy`) and vice versa.
# A second guard holds this default identical to that section, so the standard
# HydraFlow ships is the standard HydraFlow runs. Editing one surface without
# the other reddens CI.
#
# v1 encodes the README table 1:1 — no restrictions beyond the prose.
# `paths` / `labels` matchers are intentionally empty: tightening the policy
# (e.g. requiring an operator approval for workflow changes) is a one-line
# edit here plus its README row, not a code change.

schema_version: 1

merge_gate:
  # The one table binding enforced at the factory's own merge seam: merging a
  # PR that neither the human operator nor the orchestrator's reviewer
  # approved is the high-blast-radius action `merge-unapproved-pr`.
  unapproved_merge_class: high-blast-radius
  # Break-glass: an operator attaches `policy-override:<reason-slug>` to the
  # PR; the merge proceeds and a `break_glass` record is appended to the CH-2
  # approval-records audit chain.
  break_glass_label_prefix: "policy-override:"
  escalation: hitl

classes:
  - id: tractable-reversible
    readme_row: "Tractable + reversible"
    autonomy: act
    default: true
    description: >-
      Act, then report what you did. Don't ask first.
    actions:
      - arch-regen-push
      - lint-fix-push
      - retarget-pr-base
      - skip-adr-tag
      - file-hydraflow-find-issue
      - rebase-stale-branch
    paths: []
    labels: []

  - id: high-blast-radius
    readme_row: "High blast radius"
    autonomy: ask
    description: >-
      Confirm before acting. Surface the proposal, get explicit OK.
    actions:
      - force-push-default-branch
      - delete-branch-unmerged-work
      - drop-persisted-data
      - modify-repo-permissions-or-rulesets
      - send-messages-on-behalf
      - merge-unapproved-pr
    paths: []
    labels: []
    required_approvals:
      count: 1
      roles: [operator, orchestrator-reviewer]
    forbidden_actors: []
    escalation: hitl

  - id: authorial-scope
    readme_row: "Authorial / scope"
    autonomy: act
    description: >-
      Needs alignment, not permission: brainstorm -> spec -> plan -> TDD
      execute per the workflow skills. Permission is implicit once the spec
      is approved.
    actions:
      - new-feature
      - refactor
      - architectural-change
    paths: []
    labels: []
