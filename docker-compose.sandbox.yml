networks:
  sandbox:
    internal: true   # the air-gap. No default gateway → no external egress.
                     # DNS resolution behavior is runtime-dependent;
                     # rely on routing failure (timeouts/refused), not NXDOMAIN.

services:
  fake-llm-http:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["python", "-m", "hydraflow_gateway.sandbox_upstream"]
    environment:
      SANDBOX_UPSTREAM_HOST: "0.0.0.0"
      SANDBOX_UPSTREAM_PORT: "8090"
      SANDBOX_UPSTREAM_API_KEY: "sandbox-provider-key"
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=1)"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  gateway-storage-init:
    image: hydraflow-gateway-sandbox:local
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - >-
        import os;
        metadata="/var/lib/hydraflow-gateway/metadata";
        bodies="/var/lib/hydraflow-gateway/bodies";
        os.chown(metadata,10001,1000); os.chmod(metadata,0o750);
        os.chown(bodies,10001,10001); os.chmod(bodies,0o700)
    volumes:
      - gateway-metadata:/var/lib/hydraflow-gateway/metadata
      - gateway-bodies:/var/lib/hydraflow-gateway/bodies
    networks: [sandbox]

  gateway:
    image: hydraflow-gateway-sandbox:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["python", "-m", "hydraflow_gateway"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_CONTROL_TOKEN: "sandbox-control-token-0123456789abcdef"
      GATEWAY_ANTHROPIC_BASE_URL: "http://fake-llm-http:8090"
      GATEWAY_ANTHROPIC_API_KEY: "sandbox-provider-key"
      GATEWAY_LEDGER_PATH: "/var/lib/hydraflow-gateway/metadata/requests.jsonl"
      GATEWAY_BODY_DIR: "/var/lib/hydraflow-gateway/bodies"
      GATEWAY_MAX_KEY_TTL_SECONDS: "86400"
    depends_on:
      fake-llm-http:
        condition: service_healthy
      gateway-storage-init:
        condition: service_completed_successfully
    volumes:
      - gateway-metadata:/var/lib/hydraflow-gateway/metadata
      - gateway-bodies:/var/lib/hydraflow-gateway/bodies
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1)"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  hydraflow:
    build:
      context: .
      dockerfile: Dockerfile.agent
    # The selection of MockWorld vs. production is at the entrypoint level —
    # this container always runs the sandbox entrypoint. The production
    # image runs the `hydraflow` console script (entry point `server:main`
    # per pyproject.toml) instead.
    command: ["python", "-m", "mockworld.sandbox_main", "/seed/scenario.json"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      HYDRAFLOW_DASHBOARD_HOST: "0.0.0.0"
      HYDRAFLOW_DASHBOARD_PORT: "5555"
      HYDRAFLOW_ENV: "sandbox"
      HYDRAFLOW_DATA_ROOT: "/tmp/hydraflow"
      HYDRAFLOW_GATEWAY_BASE_URL: "http://gateway:8080"
      HYDRAFLOW_GATEWAY_LEDGER_PATH: "/gateway-metadata/requests.jsonl"
      HYDRAFLOW_GATEWAY_CONTROL_TOKEN: "sandbox-control-token-0123456789abcdef"
      HYDRAFLOW_GATEWAY_REPO_CLASS: "hydraflow"
      HYDRAFLOW_GATEWAY_KEY_TTL_SECONDS: "3660"
      # Canary P4: the bounded ADR reviewer is the first real agentic role
      # dialed to the gateway. MockWorld still injects the LLM fake for other
      # roles; s91 drives the gateway over its real Docker network.
      HYDRAFLOW_ADR_REVIEW_PROVIDER: "gateway"
      # No real credentials needed — the Fakes don't use them. These
      # placeholders are present only so legacy code paths that read
      # `os.environ["GH_TOKEN"]` at startup don't crash before the Fake
      # adapters take over.
      GH_TOKEN: "unused-by-fake-github"
      # ``TranscriptSummarizer`` shells out to real ``claude -p`` via
      # ``build_lightweight_command`` after every implementer/planner/
      # reviewer run.  In this air-gapped network it can't reach the
      # Anthropic API → infinite retries → scenarios time out (root
      # cause of the rc/* promotion Sandbox failure on 2026-05-17).
      # The ``runners=fake_llm`` override in ``mockworld.sandbox_main``
      # rebinds the four phase runners but NOT the summarizer, so we
      # disable it explicitly here.  Sandbox scenarios assert lifecycle
      # outcomes, never summarizer comment text.
      HYDRAFLOW_TRANSCRIPT_SUMMARIZATION_ENABLED: "false"
      # ConvergenceOscillationLoop interval (s51). Deliberately NOT set here:
      # the pydantic field enforces ge=300 (5 min minimum), so a fast-tick
      # value like "5" fails validation and is silently ignored by
      # _apply_env_overrides (ValueError suppressed), leaving the config
      # field at its default 3600 — a misleading no-op. Sandbox already gets
      # a fast tick regardless: WorkerRegistryCallbacks(get_interval=lambda
      # *_: 60) overrides every caretaker loop's interval to 60 s via
      # LoopDeps.interval_cb, which takes precedence over
      # _get_default_interval(). Effective interval is 60 s.
      HYDRAFLOW_CONVERGENCE_OSCILLATION_LOOP_ENABLED: "true"
      # HumanSteeringLoop (ADR-0099 #4, s52). human_steering_enabled is
      # already default-on (src/config.py) but is set explicitly here for
      # clarity. The allowlist defaults to [] (honors nobody, safe-by-
      # default) so s52's seeded /pause comment needs its author explicitly
      # allow-listed here — "steer-bot" must match the login s52 seeds the
      # /pause comment from (tests/sandbox_scenarios/scenarios/
      # s52_human_steering_directive.py).
      HYDRAFLOW_HUMAN_STEERING_ENABLED: "true"
      HYDRAFLOW_HUMAN_STEERING_AUTHORIZED_USERS: "steer-bot"
      # DiagnosticLoop defaults OFF in production (#9895/#9898 — credit flood),
      # but s05's escalation chain (review exhaustion → diagnostic → HITL)
      # needs the STATIC config gate open. The per-seed ADR-0049 kill-switch
      # (loops_enabled) still decides which scenarios actually run the loop —
      # only seeds listing "diagnostic" do; the sentinel routes its subprocess
      # to a scripted not-fixable diagnosis, so no real spawn ever happens.
      HYDRAFLOW_DIAGNOSTIC_LOOP_ENABLED: "true"
    volumes:
      - ./tests/sandbox_scenarios/seeds:/seed:ro
      - gateway-metadata:/gateway-metadata:ro
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5555/healthz"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s

  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile.ui
    depends_on:
      hydraflow:
        condition: service_healthy
    networks: [sandbox]
    ports:
      - "127.0.0.1:5556:80"   # bound to localhost ONLY for human debugging.

  playwright:
    # The MS playwright image ships browsers + the playwright wheel but no
    # test runner. ``Dockerfile.playwright`` pre-installs pytest etc. at
    # build time so the sandbox can stay air-gapped (``internal: true``) —
    # pip cannot reach pypi from inside the sandbox network.
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - .:/work:ro
      - sandbox-results:/results
    working_dir: /work
    environment:
      SANDBOX_BASE_URL: "http://ui"
      SANDBOX_API_BASE: "http://hydraflow:5555"
      SANDBOX_GATEWAY_BASE: "http://gateway:8080"
      SANDBOX_GATEWAY_CONTROL_TOKEN: "sandbox-control-token-0123456789abcdef"
      # ``tests`` is a package at the repo root; the runner conftest +
      # test_scenarios.py both ``import tests.sandbox_scenarios...``.
      # ``src`` is on the path so ``mockworld.seed.MockWorldSeed``
      # resolves when scenario modules are imported by ``loader.py``.
      PYTHONPATH: "/work:/work/src"
    depends_on:
      ui:
        condition: service_started
    networks: [sandbox]
    # The harness CLI overrides this command with the per-scenario invocation.
    command: ["pytest", "tests/sandbox_scenarios/runner/", "-v", "--junitxml=/results/junit.xml"]

volumes:
  sandbox-results:
  gateway-metadata:
  gateway-bodies:
