# Machine-readable identity for this standard (#11751, epic #11752).
#
# `id` MUST equal the directory name — charter.yaml's `articles.standards`
# entries resolve against it, and an id that names no directory is a
# declaration with no subject.
#
# `enforced_by` lists the pytest paths that hold this standard's prose to its
# artifact. Each path must exist AND be collected by pytest; a citation to a
# gate that never runs is a citation to nothing. The README's `Enforced by`
# block is the same set written a second time, and the two must agree.
#
# Both properties: tests/architecture/test_standards_registry.py
id: adr_enforcement
enforced_by:
  - tests/architecture/test_adr_enforcement_ratchet.py

# Each normative rule in README.md names the check that catches its violation.
# Properties: tests/architecture/test_standards_rules_are_wired.py

rules:
  - id: no-new-unenforced-accepted-adr
    claim: A new Accepted ADR ships real enforcement or is explicitly exempted; it may never grow the debt
    enforced_by: tests/architecture/test_adr_enforcement_ratchet.py::test_no_new_or_ungrandfathered_debt
  - id: debt-only-shrinks
    claim: The grandfathered enforcement debt count is monotonically non-increasing
    enforced_by: tests/architecture/test_adr_enforcement_ratchet.py::test_debt_count_is_monotonically_non_increasing
  - id: exemptions-name-real-adrs
    claim: Every exemption references an existing Accepted ADR that is not already enforced
    enforced_by: tests/architecture/test_adr_enforcement_ratchet.py::test_exemptions_reference_existing_accepted_adrs
  - id: resolved-debt-is-really-resolved
    claim: An ADR removed from the baseline genuinely has a check that asserts it now
    enforced_by: tests/architecture/test_adr_enforcement_ratchet.py::test_resolved_adrs_are_genuinely_real_now
  - id: accepted-adrs-declare-enforcement
    claim: Every Accepted ADR declares how it is enforced, so the ratchet has something to check
    enforced_by: tests/test_adr_conformance_coverage.py::test_every_accepted_adr_declares_enforcement

