# See docs/standards/adr_enforcement/standard.yaml for what these keys mean.
# Properties: tests/architecture/test_standards_registry.py
id: ports-and-loops
enforced_by:
  - tests/architecture/test_ports_and_loops_standard_drift.py

# Each normative rule in README.md names the check that catches its violation.
# Properties: tests/architecture/test_standards_rules_are_wired.py
#
# `enforced_by` above says a FILE exists. These say a RULE is checked — the
# distinction that let "Must satisfy the Protocol structurally" sit in prose
# while ~60 tests hand-rolled a bare MagicMock where a Port belonged (#11908).
rules:
  - id: fake-satisfies-protocol
    claim: Every Port's Fake satisfies the Protocol structurally, signature for signature
    enforced_by: tests/test_mockworld_fakes_conformance.py::test_fake_signatures_match_port

  - id: registry-lists-the-live-ports
    claim: The README port table is an extract of the live ports, never a hand list
    enforced_by: tests/architecture/test_ports_and_loops_standard_drift.py::test_the_port_registry_lists_exactly_the_live_ports

  - id: registry-lists-the-live-loops
    claim: The README loop table is an extract of the live loops, never a hand list
    enforced_by: tests/architecture/test_ports_and_loops_standard_drift.py::test_the_loop_registry_lists_exactly_the_live_loops

  - id: every-loop-has-a-scenario
    claim: Every registered loop is driven by at least one MockWorld scenario
    enforced_by: tests/architecture/test_mockworld_loop_scenario_ratchet.py::test_every_loop_is_driven_by_a_mockworld_scenario

unenforced:
  - id: tests-stand-in-with-the-fake
    claim: A test standing in for a Port uses that Port's Fake, not a bare MagicMock
    why: >-
      No check exists. Roughly 60 sites pass `MagicMock()` where a Port belongs,
      so adding one async method to a Protocol breaks all of them at once with
      "object MagicMock can't be used in 'await' expression" — a message naming
      neither the port nor the method (#11908 hit this three times in one
      change). Writing the check is easy; migrating the call sites is the work,
      and doing it in the same change as a port addition buries the port change.
