# docs/arch/functional_areas.yml
#
# Hand-curated: each loop and Port must appear in exactly one area.
# `tests/architecture/test_functional_area_coverage.py` enforces.
# Schema: src/arch/_functional_areas_schema.py
#
# The eight worker areas below mirror the operator dashboard's
# System -> Workers grouping (src/ui/src/constants.js WORKER_GROUPS +
# each worker's `group`). Keep them in sync: a loop's area here must match
# its worker `group` in the UI. The remaining areas cover the non-worker
# surfaces the UI does not group (Ports, persistence, the harness, the
# dashboard itself, the orchestration pipeline, discovery engines).
#
# Loop membership is validated against the live extractor: 65 loops, 10 Ports.

areas:
  repo_health:
    label: Repo Health
    description: >
      Security, quality, and hygiene workers that keep the repository
      healthy — dependency/security patching, CI-red repair, stale-issue and
      workspace GC, flake and erosion tracking, and the falsification
      instruments (escape ledger, intervention tally, sampled audit,
      second-order vitals) that guard against a green-while-dying pipeline.
    loops:
      - AutoTightenLoop
      - CIMonitorLoop
      - DependabotMergeLoop
      - ErosionMetricsLoop
      - EscapeLedgerLoop
      - FailOpenMonitorLoop
      - FlakeTrackerLoop
      - GateHealthLoop
      - InterventionTallyLoop
      - IssueRefinementLoop
      - LabelDriftWatcherLoop
      - PrRedRepairLoop
      - RCBudgetLoop
      - RunsGCLoop
      - SampledAuditLoop
      - SecondOrderVitalsLoop
      - SecurityPatchLoop
      - StaleIssueGCLoop
      - StaleIssueLoop
      - WorkspaceGCLoop
    related_adrs: ['0029', '0045', '0049', '0082']

  learning:
    label: Learning & Insights
    description: >
      Knowledge and insight workers that digest what the factory produces —
      retrospective analysis, repo-wiki freshness, term proposal/pruning,
      memory backlog, corpus learning, edge/skill proposals, pricing refresh,
      and fake-coverage auditing.
    loops:
      - CorpusLearningLoop
      - EdgeProposerLoop
      - EntryEvidenceLoop
      - FakeCoverageAuditorLoop
      - MemoryBacklogLoop
      - PricingRefreshLoop
      - RepoWikiLoop
      - RetrospectiveLoop
      - SkillPromptEvalLoop
      - TermProposerLoop
      - TermPrunerLoop
    related_adrs: ['0029', '0032', '0053']

  governance:
    label: Governance & Audit
    description: >
      Audit, compliance, and drift workers that hold the factory to its own
      declared rules — ADR conformance/drift/touchpoint auditing, branch-
      protection and gate-activation audits, contract refresh, principles
      audit, live-corpus replay, fitness scorecards, wiki-rot detection, and
      the self-documenting architecture DiagramLoop.
    loops:
      - AdrConformanceLoop
      - BranchProtectionAuditorLoop
      - ContractRefreshLoop
      - DiagramLoop
      - FitnessScorecardLoop
      - GateActivatorLoop
      - LiveCorpusReplayLoop
      - PrinciplesAuditLoop
      - CharterDriftCaretakerLoop
      - WikiRotDetectorLoop
    related_adrs: ['0045', '0082', '0100', '0101', '0121']

  release:
    label: Release
    description: >
      Release-candidate promotion and recovery per the two-tier branch model
      (ADR-0042) — cutting RC snapshots from staging and auto-promoting on
      green CI, and bisecting the culprit PR on RC-red with an auto-revert.
    loops:
      - StagingBisectLoop
      - StagingPromotionLoop
    related_adrs: ['0042']

  meta_observability:
    label: Meta-Observability
    description: >
      Monitoring and observability workers that watch the factory watching
      itself — pipeline-trend health monitoring / auto-tuning, the gateway-
      transit coverage gauge, and the trust-fleet sanity check that keeps the
      meta-observability layer honest.
    loops:
      - GatewayCoverageLoop
      - GoalSupervisorLoop
      - HealthMonitorLoop
      - TrustFleetSanityLoop
    modules:
      - src/gateway_coverage.py
      - src/gateway_coverage_loop.py
    related_adrs: ['0045', '0056', '0093', '0110', '0124']

  operations:
    label: Operations
    description: >
      Infrastructure, recovery, and lifecycle workers that keep the pipeline
      moving — the LLM gateway data/control planes, cost-budget watching,
      diagnostics, epic monitoring/sweeping, GitHub cache, merge-state
      watching, and PR unsticking.
    loops:
      - CostBudgetWatcherLoop
      - DiagnosticLoop
      - EpicMonitorLoop
      - EpicSweeperLoop
      - GitHubCacheLoop
      - MergeStateWatcherLoop
      - PRUnstickerLoop
    modules:
      - gateway/**
      - src/hydraflow_gateway/**
    related_adrs: ['0029', '0110']

  intake:
    label: Intake
    description: >
      Intake workers that turn external signals into pipeline work — ADR
      review routing, Sentry error ingest, server-log error ingest, and
      queued bug-report processing.
    loops:
      - ADRReviewerLoop
      - LogIngestLoop
      - ReportIssueLoop
    related_adrs: ['0029', '0050']

  autonomy:
    label: Autonomy
    description: >
      The HITL-autonomy fleet that closes the loop without a human — the
      Auto-Agent pre-flight interceptor, triage-retry re-entry, human-steering
      ingest, detector calibration, disturbance dampening, convergence-
      oscillation damping, and sandbox-failure fixing. Per ADR-0050/0063.
    loops:
      - AutoAgentPreflightLoop
      - ConvergenceOscillationLoop
      - DetectorCalibrationLoop
      - DisturbanceDampenerLoop
      - HumanSteeringLoop
      - SandboxFailureFixerLoop
      - TriageRetryLoop
    modules:
      - src/auto_agent_preflight_loop.py
      - src/preflight/**
      - src/triage_retry_loop.py
      - src/convergence_oscillation_loop.py
      - src/human_steering_loop.py
      - src/human_steering.py
    related_adrs: ['0050', '0063', '0098', '0099']

  hexagonal_boundaries:
    label: Hexagonal Boundaries
    description: >
      The Port/Adapter seam between domain runtime and the outside world
      (GitHub, git, the LLM, the filesystem, observability, conformance
      running). Each Port has at least one concrete adapter and (per ADR-0047)
      a fake under src/mockworld/fakes/.
    ports:
      - AgentPort
      - BotPRPort
      - ConformanceRunnerPort
      - IssueFetcherPort
      - IssueStorePort
      - ObservabilityPort
      - PRPort
      - ReviewInsightStorePort
      - RouteBackCounterPort
      - WorkspacePort
    related_adrs: ['0006', '0010', '0047']

  state_persistence:
    label: State & Persistence
    description: >
      Crash-recovery state (StateTracker), event bus, session logs, and the
      on-disk layout that keeps the pipeline resumable across crashes and
      restarts.
    modules:
      - src/state/**
      - src/events.py
      - src/state/_session.py
    related_adrs: ['0021', '0028']

  test_harness:
    label: Test Harness (MockWorld)
    description: >
      The scenario-ring test harness — `MockWorld` aggregates the fakes that
      emulate every external dependency and integration target. Per ADR-0022
      (MockWorld) and ADR-0047 (fake-adapter contract testing).
    modules:
      - tests/scenarios/fakes/**
      - tests/scenarios/builders/**
    related_adrs: ['0022', '0047']

  arch_knowledge:
    label: Architecture Knowledge
    description: >
      The self-documenting layer — AST extractors, generators, CI guard, and
      Pages site that publish live architectural truth alongside ADRs and the
      wiki. The DiagramLoop that refreshes it lives under Governance & Audit.
    modules:
      - src/arch/**
    related_adrs: ['0029', '0032']

  dashboard:
    label: Dashboard
    description: >
      The operator-facing FastAPI + React dashboard for observing the fleet
      and overriding routing decisions.
    modules:
      - src/ui/**
      - src/dashboard*.py
      - src/dashboard_routes/**
      - src/routes/**
    related_adrs: ['0007', '0008', '0009', '0030']

  goal_driven_dev:
    label: Goal-Driven Development
    description: >
      Discovery research and direction shaping for vague or broad work.
      ADR-0107 retired the standalone Discover/Shape pipeline phases: these
      engines (DiscoverRunner / ShapeRunner and their expander / completeness
      / coherence helpers) are now invoked on demand by the planner behind its
      decision gate rather than as dedicated loops or labels.
    modules:
      - src/discover_runner.py
      - src/discover_expander.py
      - src/discover_completeness.py
      - src/shape_runner.py
      - src/shape_coherence.py
    related_adrs: ['0031', '0107']

  orchestration:
    label: Orchestration
    description: >
      The plan->implement->review pipeline driving each issue from
      hydraflow-ready through merge. The original five-loop system per
      ADR-0001 (now amended); RunLoop and friends live as call-sites within
      orchestrator.py rather than as separate BaseBackgroundLoop subclasses.
    modules:
      - src/orchestrator.py
      - src/agent/
      - src/planner.py
      - src/reviewer/
      - src/triage_phase.py
      - src/plan_phase.py
      - src/implement_phase/
      - src/review_phase/
      - src/hitl_phase.py
    related_adrs: ['0001', '0004', '0011', '0012', '0029']
