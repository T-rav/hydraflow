comment: 'High-water marks for structural test redundancy (erosion.suite_hygiene):
  parametrize copies (identical bodies in one file) and cross-file duplicate tests.
  The gate fails only when a count rises above its mark; falling is the point. Last
  moved: Re-mark after #11717 (fix(audit): resolve source modules across both src
  layouts) raised parametrize copies 409 -> 413 on staging without re-marking, leaving
  the ratchet red for every downstream PR. Measured: pristine origin/staging is already
  at 413; #11720 adds 0.'
cross_file_duplicates: 21
parametrize_copies: 413
