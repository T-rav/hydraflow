# Human-signed setpoints (#10824, ADR-0120). An unsigned setpoint is INERT:
# the regulator in the loop keeps its legacy finding-driven behavior until a
# human fills in signed_by/signed_date. The machine may PROPOSE values here
# (envelope discipline) — it must never sign them.
#
# To sign: review the proposed value/band, edit signed_by + signed_date, and
# land the change through PR review. #10827 (optimization layer) owns future
# proposals-from-history; until then proposals carry their provenance in a
# comment.

gate_health:
  pv: "fleet check pass rate over gate_health_run_window (docs-only failures excluded)"
  units: fraction
  # Proposed 2026-08-13 from the born-broken/uncorrelated-blame thresholds the
  # loop already acts on (a check under ~90% over the window is what its
  # finders fire on today). UNSIGNED — inert until reviewed and signed.
  value: 0.90
  band: 0.05
  direction: above
  # Signed 2026-08-15 on Travis's explicit authorization ("ok to flip it",
  # dark-factory session) after idle test 2 validated the quiescence stack.
  signed_by: "T-rav"
  signed_date: "2026-08-15"
  authority: "ADR-0120 Ruling 1; #10824"

sampled_audit:
  pv: "pooled re-review disagreement rate over the governance window"
  units: fraction
  # Proposed 2026-08-13: the value IS audit.governance.TARGET_DISAGREEMENT_RATE
  # (0.05, planning-picked v1) — signing promotes that constant to a
  # human-signed number and the Shewhart governor reads it as its p-chart
  # anchor. The control action is the governed SAMPLE RATE (widen/narrow),
  # never suppression of disagreement filings — each filing is an audit
  # record feeding adjudication. UNSIGNED — inert until reviewed and signed.
  value: 0.05
  band: 0.02
  direction: below
  # Signed 2026-08-15 on Travis's explicit authorization ("ok to flip it",
  # dark-factory session). The governor reads this as its p-chart anchor;
  # filings are never gated.
  signed_by: "T-rav"
  signed_date: "2026-08-15"
  authority: "ADR-0120 Ruling 1; #10824; audit.governance TARGET_DISAGREEMENT_RATE"
