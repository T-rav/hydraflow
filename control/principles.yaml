# --- Graded "measured but not enforced" 2026-07-30: now EXPLICITLY human-held.
# Each may later flip to setpoint by signing a per-area band (the #11077
# worked example: keep-it-simple → entanglement/context-cost band). Until a
# band is signed, a person holds it — with a currency contract.
keep-it-simple:
  statement: "Entanglement and context cost stay acceptable per area."
  holding: human
  held_by: travis
  currency_days: 90
  last_exercised: "2026-07-30"
  instruments:
    - "erosion spread/scatter/concentration sensors"
    - "context-cost tracking"
prefer-what-exists:
  statement: "Reuse and wire existing machinery before building new."
  holding: human
  held_by: travis
  currency_days: 90
  last_exercised: "2026-07-30"
  instruments:
    - "AutoTightenLoop"
    - "arch module graph"
improve-by-rate:
  statement: "Improvement is a governed rate, not an unbounded drive."
  holding: human
  held_by: travis
  currency_days: 90
  last_exercised: "2026-07-30"
  instruments:
    - "loop fitness scores"
    - "maintenance-flux / oscillation fingerprint"
