# Principle register (#11077): every principle the factory claims is either
# setpoint-encoded (able to rest — silence inside its enforcement) or
# EXPLICITLY human-held with a currency requirement. Nothing in the middle:
# "measured but not enforced" is where principles become decoration.
#
# Currency staleness is surfaced by the principles_audit LOOP at runtime —
# deliberately never a CI assertion (that would be a wall-clock time-bomb by
# design). To exercise a human-held principle: do the review it names, then
# update last_exercised in the same PR.

# --- ADR-0044 audit contract: setpoint-held (the exemplar — pass = silence) ---
P1-documentation-contract:
